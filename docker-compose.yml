# Runs Revia (the PWA + API) in a container with a persistent data volume.
#
#   cp .env.example .env   # then edit .env (at least REVIA_JWT_KEY)
#   docker compose up -d --build
#
# Open http://localhost:${REVIA_PORT} (default 8080).
#
# Secrets are required in .env and are not stored in the repository.

services:
  revia:
    build:
      context: .
      dockerfile: Dockerfile
    image: revia:latest
    container_name: revia
    ports:
      - "${REVIA_PORT:-8080}:8080"
    environment:
      Jwt__SigningKey: "${REVIA_JWT_KEY:-change-me-to-a-long-random-32+char-secret-please}"
      Seed__AdminPassword: "${REVIA_ADMIN_PASSWORD:?Set REVIA_ADMIN_PASSWORD in .env}"
      Demo__Enabled: "${REVIA_DEMO_ENABLED:-false}"
      # Default false so data PERSISTS across restarts. Only set true for a throwaway
      # demo that should wipe everything visitors changed on each start.
      Demo__ResetOnStartup: "${REVIA_DEMO_RESET:-false}"
      Tmdb__ApiKey: "${REVIA_TMDB_KEY:-}"
      # Optional: export OpenTelemetry traces/metrics to an OTLP collector.
      # Empty (default) disables export — the app runs without a collector.
      OTEL_EXPORTER_OTLP_ENDPOINT: "${REVIA_OTEL_ENDPOINT:-}"
    volumes:
      - revia-data:/data
    restart: unless-stopped

volumes:
  revia-data:
