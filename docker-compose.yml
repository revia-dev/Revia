# Runs Revia (the PWA + API) in a container with a persistent data volume.
#
#   cp .env.example .env   # then edit .env (at least REVIA_JWT_KEY)
#   docker compose up -d --build
#
# Open http://localhost:${REVIA_PORT}  (default 8080). For a LAN/Domain/HTTPS setup
# see README and docs/local-domain-https.md.
#
# All settings come from .env; the defaults after ":-" make it run out of the box.

services:
  revia:
    build:
      context: .
      dockerfile: Dockerfile
    image: revia:latest
    container_name: revia
    ports:
      - "${REVIA_PORT:-8080}:8080"
    environment:
      Jwt__SigningKey: "${REVIA_JWT_KEY:-change-me-to-a-long-random-32+char-secret-please}"
      Seed__AdminPassword: "${REVIA_ADMIN_PASSWORD:-Admin123!}"
      Demo__Enabled: "${REVIA_DEMO_ENABLED:-false}"
      Demo__ResetOnStartup: "${REVIA_DEMO_RESET:-true}"
      Tmdb__ApiKey: "${REVIA_TMDB_KEY:-}"
    volumes:
      - revia-data:/data
    restart: unless-stopped

volumes:
  revia-data:
