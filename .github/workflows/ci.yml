name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Check repository hygiene
        run: bash scripts/check-repository-hygiene.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Revia.slnx

      - name: Build
        run: dotnet build Revia.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test Revia.slnx -c Release --no-build --verbosity normal
        env:
          Seed__AdminPassword: CI_placeholder_password_123!
