name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PrivateLibrary/PrivateLibrary.csproj

      - name: Build
        run: dotnet build PrivateLibrary/PrivateLibrary.csproj -c Release --no-restore

      - name: Test
        run: |
          if [ -f "PrivateLibrary.Tests/PrivateLibrary.Tests.csproj" ]; then
            dotnet test PrivateLibrary.Tests/PrivateLibrary.Tests.csproj -c Release --no-build --verbosity normal
          else
            echo "No test project found, skipping tests."
          fi
        env:
          Seed__AdminPassword: CI_placeholder_password_123!
