<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revia — Audio Architecture Walkthrough</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#2a3038;--text:#e6edf3;--muted:#8b949e;
        --accent:#58a6ff;--green:#3fb950;--code:#0b0e13}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--text);line-height:1.6}
  .layout{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
  aside{position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel);
        border-right:1px solid var(--line);padding:20px}
  aside h1{font-size:18px;display:flex;align-items:center;gap:10px;margin-bottom:4px}
  aside .mark{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#5856d6,#0a84ff)}
  aside p{color:var(--muted);font-size:12px;margin-bottom:18px}
  .toc a{display:block;color:var(--muted);text-decoration:none;font-size:13px;padding:7px 10px;
         border-radius:8px;border-left:2px solid transparent}
  .toc a:hover{color:var(--text);background:#1c2230}
  .toc a.active{color:var(--text);background:#1c2230;border-left-color:var(--accent)}
  main{padding:40px clamp(20px,5vw,72px);max-width:900px}
  .controls{position:sticky;top:0;background:rgba(13,17,23,.85);backdrop-filter:blur(12px);
       border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;
       gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:32px;z-index:5}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#1c2230;color:var(--text);
       border-radius:10px;padding:8px 14px;display:inline-flex;align-items:center;gap:7px}
  button:hover{border-color:var(--accent)}
  button.primary{background:linear-gradient(135deg,#5856d6,#0a84ff);border:none}
  select,input[type=range]{font:inherit;background:#1c2230;color:var(--text);border:1px solid var(--line);
       border-radius:10px;padding:7px}
  .controls label{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
  section{margin-bottom:56px;scroll-margin-top:90px}
  section.speaking{outline:2px solid var(--accent);outline-offset:14px;border-radius:8px}
  h2{font-size:26px;letter-spacing:-.01em;margin-bottom:6px}
  .kicker{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .sec-controls{display:flex;gap:8px;margin:14px 0 18px}
  .narr{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--green);
        border-radius:12px;padding:16px 18px;color:#cdd6e0;font-size:15px}
  pre{background:var(--code);border:1px solid var(--line);border-radius:12px;padding:18px;
      overflow:auto;margin-top:16px;font-size:13px;line-height:1.5}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .k{color:#ff7b72}.t{color:#79c0ff}.s{color:#a5d6ff}.c{color:#8b949e;font-style:italic}.f{color:#d2a8ff}
  .tag{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);
       border-radius:999px;padding:2px 10px;margin-left:8px}
  @media(max-width:820px){.layout{grid-template-columns:1fr}aside{position:static;height:auto}}
</style>
</head>
<body>
<div class="layout">
<aside>
  <h1><span class="mark"></span> Revia</h1>
  <p>Code &amp; architecture walkthrough — narrated. Press play and listen.</p>
  <nav class="toc" id="toc"></nav>
</aside>
<main>
  <div class="controls">
    <button class="primary" id="playAll">▶︎ Play all</button>
    <button id="pause">⏸ Pause</button>
    <button id="stop">⏹ Stop</button>
    <label>Voice <select id="voice"></select></label>
    <label>Speed <input type="range" id="rate" min="0.7" max="1.3" step="0.05" value="1"></label>
    <span id="status" style="color:var(--muted);font-size:12px"></span>
  </div>
  <div id="content"></div>
</main>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────
// The walkthrough content. Each section carries a narration that the Web
// Speech API reads aloud, plus the code it explains. This is the C# web app
// (Blazor WebAssembly PWA + ASP.NET Core API); the Apple app has its own.
// ─────────────────────────────────────────────────────────────────────────
const SECTIONS = [
{
  id:"overview", kicker:"01 · Orientation", title:"What Revia is, and the constraint that shapes it",
  narration:`Revia is an offline-capable Progressive Web App for the household — movies, a TV guide, games, lending, BMI, wishlists and people. It began as a Blazor Server app and was rebuilt into a standalone Blazor WebAssembly PWA with a clean four-layer split: a Client that is the WASM user interface and offline engine, an Api that hosts both the PWA and the REST endpoints, a Shared project of DTOs, and the original domain and identity layer that the Api reuses. The constraint that shapes everything is that the app must keep working with no connectivity — the home server may be off, the phone may be out of range — and then reconcile cleanly when the connection returns. Watch how each layer serves that: the client reads from a local cache, queues writes, and resolves conflicts server-wins.`,
  code:`Revia.Client   <span class="c">// Blazor WebAssembly PWA — UI, IndexedDB cache, sync engine</span>
Revia.Api      <span class="c">// ASP.NET Core host — serves the PWA *and* the REST API (JWT)</span>
Revia.Shared   <span class="c">// DTOs / contracts shared by Client and Api</span>
Revia          <span class="c">// existing domain + identity layer (reused by the Api)</span>
Revia.Tests / Revia.IntegrationTests   <span class="c">// unit + WebApplicationFactory</span>`
},
{
  id:"offline", kicker:"02 · Offline engine", title:"An outbox the SyncEngine replays — testably",
  narration:`The heart of the client is offline-first. Reads come from the API when online and are cached to IndexedDB; offline, they come from that cache. Writes are applied optimistically to the local cache and appended to an outbox — a queue of mutations, each keyed by a client-generated GUID so a replay is idempotent. A SyncEngine drains the outbox oldest-first when connectivity returns, with exponential backoff on transient failures and a poison flag after a cap, so one stuck mutation can never wedge everything behind it. Conflicts resolve server-wins: after a successful flush the client refreshes from the server. The important design move is that the engine depends only on two small abstractions — an outbox store and a connectivity signal — not on the browser. That is what lets the riskiest component be unit-tested headlessly, with in-memory fakes, instead of only in a browser.`,
  code:`<span class="k">public sealed class</span> <span class="t">SyncEngine</span>(<span class="t">IOutboxStore</span> store, <span class="t">IConnectivity</span> connectivity)
{
  <span class="c">// Replays FIFO; skips poisoned/not-yet-due; backs off; never wedges the queue.</span>
  <span class="k">public async</span> <span class="t">Task</span>&lt;<span class="t">SyncResult</span>&gt; <span class="f">FlushAsync</span>() {
    <span class="k">foreach</span> (<span class="k">var</span> m <span class="k">in</span> <span class="k">await</span> _store.<span class="f">OutboxAllAsync</span>()) {
      <span class="k">if</span> (m.Poison || <span class="f">NotDueYet</span>(m)) <span class="k">continue</span>;
      <span class="k">var</span> ok = <span class="k">await</span> _handlers[m.Collection](m);   <span class="c">// server-wins replay</span>
      <span class="k">if</span> (!ok) <span class="k">await</span> <span class="f">RecordFailureAsync</span>(m);          <span class="c">// backoff → poison at cap</span>
    }
  }
}`
},
{
  id:"auth", kicker:"03 · Auth & authorization", title:"Tokens hashed at rest, permissions enforced in the API",
  narration:`Because the WASM client is a separate concern from the server's cookie auth, requests are authorized with tokens. Short-lived JWT access tokens carry the user, roles and household claims; long-lived refresh tokens are rotated on every use. Crucially, refresh tokens are hashed at rest with SHA-256 — the plaintext is handed to the client once and never stored, so a database leak yields no usable token. Authorization is enforced in the API, not just hidden in the UI: a module access filter requires read permission for safe requests and write permission for mutations, so a direct call from anything is checked. Two more layers guard the login surface — Identity per-account lockout and an edge rate limiter — and the host fails fast in Production if the signing key is missing or weak, because that single secret backs every token.`,
  code:`<span class="c">// Only the hash is stored; lookup hashes the incoming token.</span>
<span class="k">internal static string</span> <span class="f">HashToken</span>(<span class="k">string</span> token)
  => <span class="t">Convert</span>.<span class="f">ToHexString</span>(<span class="t">SHA256</span>.<span class="f">HashData</span>(<span class="t">Encoding</span>.UTF8.<span class="f">GetBytes</span>(token)));

<span class="c">// Per-module read/write enforced server-side (not just in the UI).</span>
<span class="k">var</span> allowed = <span class="f">IsSafe</span>(request.Method) ? access.CanRead : access.CanWrite;
<span class="k">if</span> (!allowed) context.Result = <span class="k">new</span> <span class="t">ForbidResult</span>();</span>`
},
{
  id:"observability", kicker:"04 · Observability", title:"You can see what it does in production",
  narration:`A sync system with optimistic writes is unmaintainable if you cannot see what it did, so the host is built to be observed. Every request is logged structurally — method, path, status, duration — and startup migration, seeding and auth events are logged explicitly. Distributed tracing and metrics come from OpenTelemetry with auto-instrumentation for ASP.NET Core, outgoing HTTP and the runtime; the OTLP exporter is wired only when an endpoint is configured, so the app boots identically with or without a collector — no hard dependency on observability infrastructure. There are health probes: a cheap liveness endpoint and a readiness endpoint that also checks the database, which the Docker image probes. And a global exception handler turns any unhandled error into an RFC seven-eight-oh-seven problem-details response carrying a trace id — the stack trace stays in the logs, never on the wire.`,
  code:`<span class="c">// Export only when an endpoint is set — no collector needed to boot.</span>
services.<span class="f">AddOpenTelemetry</span>()
  .<span class="f">WithTracing</span>(t => { t.<span class="f">AddAspNetCoreInstrumentation</span>().<span class="f">AddHttpClientInstrumentation</span>();
                  <span class="k">if</span> (exportEnabled) t.<span class="f">AddOtlpExporter</span>(); })
  .<span class="f">WithMetrics</span>(m => { m.<span class="f">AddAspNetCoreInstrumentation</span>().<span class="f">AddRuntimeInstrumentation</span>();
                  <span class="k">if</span> (exportEnabled) m.<span class="f">AddOtlpExporter</span>(); });

app.<span class="f">MapHealthChecks</span>(<span class="s">"/health/ready"</span>, <span class="k">new</span>(){ Predicate = c => c.Tags.<span class="f">Contains</span>(<span class="s">"ready"</span>) });</span>`
},
{
  id:"tests", kicker:"05 · Tests", title:"Unit on the engine, integration on the pipeline",
  narration:`The test strategy has two halves. Sixty-three unit tests cover the domain logic — lending status, BMI, CSV round-trips, permissions, point-transfer conservation — and, most importantly, the offline SyncEngine: FIFO replay, exponential backoff, poison handling, dropping mutations for unknown collections, and that a handler throwing is treated as a transient failure rather than crashing the flush. Those run headlessly against in-memory fakes because the engine depends only on its two abstractions. The second half is twelve integration tests that drive the real host through WebApplicationFactory over an isolated SQLite database: the health probes, the login flow returning two-hundred for the seeded admin and four-oh-one for a wrong password, a protected route rejected without a token, and the auth rate limiter actually returning four-twenty-nine under a burst. The integration project also pins the fail-fast config rules directly. Continuous integration builds the whole solution with warnings-as-errors and runs both.`,
  code:`<span class="c">// Integration: the rate limiter must throttle a burst at the edge.</span>
<span class="k">using var</span> factory = <span class="k">new</span> <span class="t">ReviaApiFactory</span>();         <span class="c">// isolated host + DB</span>
<span class="k">var</span> statuses = <span class="k">new</span> <span class="t">List</span>&lt;<span class="t">HttpStatusCode</span>&gt;();
<span class="k">for</span> (<span class="k">var</span> i = <span class="s">0</span>; i &lt; <span class="s">15</span>; i++)
  statuses.<span class="f">Add</span>((<span class="k">await</span> client.<span class="f">PostAsJsonAsync</span>(<span class="s">"/api/auth/login"</span>, bad)).StatusCode);
<span class="t">Assert</span>.<span class="f">Contains</span>(<span class="t">HttpStatusCode</span>.TooManyRequests, statuses);   <span class="c">// 429</span>`
},
{
  id:"ops", kicker:"06 · Run & ship", title:"From localhost to a containerized deployment",
  narration:`Finally, how it runs. In development a single dotnet run serves the API and the WASM client. For deployment, a multi-stage Docker image publishes the Api, ships a health-check, and receives credentials through environment variables. TLS belongs at a reverse proxy so the PWA runs in a secure browser context. The continuous-integration workflow builds the whole solution and deploy publishes the Api host — not the legacy project — and the architecture decisions behind all of this are recorded as A-D-Rs in the docs folder.`,
  code:`<span class="c"># Docker: config-driven, ships a health probe.</span>
HEALTHCHECK CMD curl -fsS http://localhost:8080/health || exit 1</span>`
}
];

// ── Render ──────────────────────────────────────────────────────────────
const content = document.getElementById('content');
const toc = document.getElementById('toc');
SECTIONS.forEach((s, i) => {
  const a = document.createElement('a');
  a.href = '#' + s.id; a.textContent = (i+1) + '. ' + s.title; a.dataset.id = s.id;
  toc.appendChild(a);

  const sec = document.createElement('section');
  sec.id = s.id;
  sec.innerHTML = `
    <div class="kicker">${s.kicker}</div>
    <h2>${s.title}</h2>
    <div class="sec-controls">
      <button data-play="${s.id}">▶︎ Play narration</button>
      <span class="tag">~${Math.round(s.narration.split(' ').length/2.3)}s</span>
    </div>
    <div class="narr">${s.narration}</div>
    <pre><code>${s.code}</code></pre>`;
  content.appendChild(sec);
});

// ── Speech ──────────────────────────────────────────────────────────────
const synth = window.speechSynthesis;
const statusEl = document.getElementById('status');
const voiceSel = document.getElementById('voice');
const rate = document.getElementById('rate');
let voices = [], queue = [], idx = 0;

function loadVoices(){
  voices = synth.getVoices().filter(v => v.lang.startsWith('en')) ;
  if(!voices.length) voices = synth.getVoices();
  voiceSel.innerHTML = '';
  voices.forEach((v,i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = `${v.name} (${v.lang})`;
    voiceSel.appendChild(o);
  });
  const preferred = voices.findIndex(v => /Samantha|Daniel|Karen|Serena|en-US/.test(v.name+v.lang));
  if(preferred >= 0) voiceSel.value = preferred;
}
loadVoices();
if(speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;

function highlight(id){
  document.querySelectorAll('section').forEach(x => x.classList.remove('speaking'));
  document.querySelectorAll('.toc a').forEach(x => x.classList.remove('active'));
  if(!id) return;
  document.getElementById(id)?.classList.add('speaking');
  document.querySelector(`.toc a[data-id="${id}"]`)?.classList.add('active');
}

function speak(section, onend){
  const u = new SpeechSynthesisUtterance(section.narration);
  const v = voices[voiceSel.value]; if(v) u.voice = v;
  u.rate = parseFloat(rate.value); u.lang = (v && v.lang) || 'en-US';
  u.onstart = () => { highlight(section.id); statusEl.textContent = '🔊 ' + section.title;
                      document.getElementById(section.id).scrollIntoView({behavior:'smooth',block:'start'}); };
  u.onend = () => onend && onend();
  synth.speak(u);
}

function playFrom(i){
  synth.cancel(); queue = SECTIONS; idx = i;
  const step = () => {
    if(idx >= queue.length){ highlight(null); statusEl.textContent = '✓ Done'; return; }
    const s = queue[idx++];
    speak(s, step);
  };
  step();
}

document.getElementById('content').addEventListener('click', e => {
  const id = e.target?.dataset?.play;
  if(!id) return;
  playFrom(SECTIONS.findIndex(s => s.id === id));
});
document.getElementById('playAll').addEventListener('click', () => playFrom(0));
document.getElementById('pause').addEventListener('click', () => {
  if(synth.speaking && !synth.paused){ synth.pause(); statusEl.textContent='⏸ Paused'; }
  else if(synth.paused){ synth.resume(); }
});
document.getElementById('stop').addEventListener('click', () => {
  synth.cancel(); highlight(null); statusEl.textContent='⏹ Stopped';
});
rate.addEventListener('input', () => { if(synth.speaking){ const i=Math.max(0,idx-1); playFrom(i); }});

// Scroll-spy for the table of contents.
const observer = new IntersectionObserver(entries => {
  entries.forEach(en => { if(en.isIntersecting && !synth.speaking){
    document.querySelectorAll('.toc a').forEach(x=>x.classList.remove('active'));
    document.querySelector(`.toc a[data-id="${en.target.id}"]`)?.classList.add('active');
  }});
}, {rootMargin:'-40% 0px -55% 0px'});
document.querySelectorAll('section').forEach(s => observer.observe(s));
</script>
</body>
</html>
